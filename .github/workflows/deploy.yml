name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_DEST: admin@130.49.149.189
      SSH_PORT: 22222
      APP_DIR: /var/www/KamshukBeauty
      PM2_APP: kamshukbeauty
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.KAMSHUK_SSH_KEY }}" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          echo "${{ secrets.KAMSHUK_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "$SSH_DEST" 'echo SSH-OK && hostname'

      - name: Backup current release
        run: ssh -p "$SSH_PORT" "$SSH_DEST" "cd $APP_DIR && rm -rf .output.bak-prev && cp -a .output .output.bak-prev"

      - name: Upload build
        run: rsync -az --delete -e "ssh -p $SSH_PORT" .output/ "$SSH_DEST:$APP_DIR/.output/"

      - name: Restart app
        run: ssh -p "$SSH_PORT" "$SSH_DEST" "pm2 restart $PM2_APP --update-env"

      - name: Health check (auto-rollback on failure)
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://kamshukbeauty.ru/)
          echo "kamshukbeauty.ru → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed — откатываю на предыдущую версию"
            ssh -p "$SSH_PORT" "$SSH_DEST" "cd $APP_DIR && rm -rf .output && mv .output.bak-prev .output && pm2 restart $PM2_APP --update-env" || true
            exit 1
          fi
